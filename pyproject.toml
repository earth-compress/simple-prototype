[project]
name = "ec-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt McCormack", email = "matcor@noc.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "georvq",
    "huggingface-hub>=1.33.0",
    "imagecodecs>=2026.10.10",
    "pydantic>=2.14.1",
]

[project.scripts]
hello = "ec_prototype:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "tqdm>=4.70.1",
]
dev = [ "ruff>=0.16.10"]

[tool.uv.sources]
clouds-decoded = { git = "https://github.com/asterisk-labs/clouds-decoded.git", branch = "compressed-readers" }
georvq = { git = "https://github.com/earth-compress/georvq" }
