[project]
name = "ec-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt McCormack", email = "matcor@noc.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "clouds-decoded",
    "humanize>=4.16.0",
    "pydantic>=2.13.5",
    "tqdm>=4.70.1",
    "transformers<5.9",
]

[project.scripts]
hello = "ec_prototype:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [ "ruff>=0.16.10"]

[tool.uv.sources]
clouds-decoded = { git = "https://github.com/asterisk-labs/clouds-decoded.git" }
